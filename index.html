<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>酒窖 Cellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-2:#FBF8F4;
    --wood:#F4EEE5;
    --wood-2:#F7F1E8;
    --line: rgba(30,22,16,.10);
    --text:#2A211C;
    --text-dim:#8A7B6E;
    --text-faint:#B7AA9D;
    --wine:#7C1F2E;
    --wine-bright:#A9384A;
    --gold:#B8873A;
    --gold-soft: rgba(184,135,58,.14);
    --danger:#B8473F;
    --danger-soft: rgba(184,71,63,.10);
    --radius-lg:22px;
    --radius-md:15px;
    --radius-sm:10px;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --slot-size: clamp(38px, 9.2vw, 58px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(124,31,46,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom: 100px;
  }
  ::selection{ background: var(--gold-soft); }
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; color:var(--text); background:var(--wood); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; font-size:15px; width:100%;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  textarea{resize:vertical; min-height:64px;}
  label{display:block; font-size:12.5px; color:var(--text-dim); margin:0 0 6px; letter-spacing:.02em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex; gap:10px;}
  .field-row > .field{flex:1; min-width:0;}

  /* header */
  header.top{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.88) 70%, transparent);
    backdrop-filter: blur(6px);
    padding: 18px 18px 8px;
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{
    font-family:var(--font-display); font-weight:700; font-size: 30px;
    margin:0; color:var(--text); letter-spacing:.01em;
  }
  h1 em{font-style:normal; color:var(--gold);}
  .stats{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); white-space:nowrap;}
  .search-btn{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex:0 0 auto;}
  .search-btn:hover{ color:var(--gold); }
  .search-wrap{ margin-top:10px; display:none; }
  .search-wrap.open{ display:block; }

  nav.tabs{ display:flex; gap:4px; margin-top:14px; border-bottom:1px solid var(--line); }
  nav.tabs button{
    flex:1; padding:11px 4px 12px; font-size:13.5px; letter-spacing:.03em; color:var(--text-faint);
    border-bottom: 2px solid transparent; font-weight:600;
  }
  nav.tabs button.active{ color:var(--gold); border-bottom-color: var(--gold); }

  .cellar-bar{ display:flex; align-items:center; gap:6px; padding: 12px 18px 2px; }
  .cellar-chips{ display:flex; gap:8px; overflow-x:auto; flex:1; min-width:0; padding-bottom:2px; }
  .cellar-chip{
    flex:0 0 auto; padding:8px 15px; border-radius:20px; font-size:13.5px; font-weight:600;
    border:1.5px solid var(--line); color:var(--text-dim); white-space:nowrap;
  }
  .cellar-chip.active{ background: var(--wine); border-color: var(--wine); color:#F6E4E6; }
  .icon-btn{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--text-dim); border:1px solid transparent;
  }
  .icon-btn:hover{ background: var(--gold-soft); color:var(--gold); }
  .shelf-name-row{ display:flex; align-items:center; gap:4px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; padding: 10px 18px 4px; font-size:11.5px; color:var(--text-dim); }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.red{background:var(--wine-bright);} .dot.white{background:#CDB35C;} .dot.rose{background:#D6839A;} .dot.sparkling{background:#D9C36B;} .dot.sake{background:#B9C4C0;}

  main{ padding: 6px 18px 40px; }

  /* empty state */
  .empty-state{ text-align:center; padding: 70px 20px; color:var(--text-dim); }
  .empty-state .glyph{ font-size:38px; margin-bottom:14px; opacity:.6; }
  .empty-state h2{ font-family:var(--font-display); font-weight:600; font-size:22px; color:var(--text); margin: 0 0 8px; }
  .empty-state p{ font-size:14px; line-height:1.6; max-width:320px; margin: 0 auto 20px; }

  /* shelves */
  .shelf{ margin-bottom: 30px; }
  .shelf-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 0 2px 12px; }
  .shelf-head h3{ font-family:var(--font-display); font-size:21px; font-weight:600; margin:0; }
  .shelf-head .meta{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
  .rack{
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border-radius: var(--radius-lg);
    padding: 18px 14px;
    box-shadow: inset 0 2px 10px rgba(40,28,16,.07), 0 1px 0 rgba(255,255,255,.6);
    display:flex; flex-direction:column; gap:7px;
    overflow-x:auto;
  }
  .rack-row{ display:flex; gap:9px; }
  .rack-row.offset{ margin-left: calc(var(--slot-size)/2 + 4.5px); }
  .slot{
    width:var(--slot-size); height:var(--slot-size); border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:600;
    transition: transform .12s ease, box-shadow .18s ease;
    position:relative;
  }
  .slot:active{ transform: scale(.92); }
  .slot.empty{ border:1.5px dashed rgba(40,28,16,.18); color:rgba(40,28,16,.24); }
  .slot.empty:hover{ border-color: rgba(201,162,75,.4); color: rgba(201,162,75,.5); }
  .slot.filled{ box-shadow: inset 0 -3px 6px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.28); }
  .slot.type-red{ background: radial-gradient(circle at 35% 30%, var(--wine-bright), #611723 72%); color:#F5E2E5; }
  .slot.type-white{ background: radial-gradient(circle at 35% 30%, #F0E4AE, #CDB35C 72%); color:#3B2F12; }
  .slot.type-rose{ background: radial-gradient(circle at 35% 30%, #F3BEC9, #D6839A 72%); color:#4A1A28; }
  .slot.type-sparkling{ background: radial-gradient(circle at 35% 30%, #F5EBB4, #D9C36B 72%); color:#3B3312; }
  .slot.type-sake{ background: radial-gradient(circle at 35% 30%, #EEF3F1, #C3CFCB 72%); color:#2C3A36; }
  .slot.selected{ box-shadow: 0 0 0 3px var(--gold), 0 0 20px 5px rgba(201,162,75,.5); }
  @media (prefers-reduced-motion: no-preference){
    .slot.selected{ animation: glow 2.4s ease-in-out infinite; }
  }
  @keyframes glow{
    0%,100%{ box-shadow: 0 0 0 3px var(--gold), 0 0 16px 3px rgba(201,162,75,.45); }
    50%{ box-shadow: 0 0 0 3px var(--gold), 0 0 24px 7px rgba(201,162,75,.62); }
  }
  .add-shelf-btn{
    width:100%; padding:16px; margin-top:6px; border-radius: var(--radius-lg);
    border:1.5px dashed var(--line); color:var(--text-faint); font-size:13.5px; letter-spacing:.03em;
  }
  .add-shelf-btn:hover{ border-color: rgba(201,162,75,.4); color:var(--gold); }

  /* list view */
  .list-row{
    display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .thumb{ width:46px; height:46px; border-radius:50%; flex:0 0 auto; background:var(--wood); display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:18px; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .name{ font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-row .sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-row .loc{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-align:right; flex:0 0 auto; }

  /* history */
  .hist-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 6px; border-bottom:1px solid var(--line); gap:10px; }
  .hist-row .info .name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .hist-row .info .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .badge{ font-size:10.5px; padding:3px 9px; border-radius:20px; letter-spacing:.03em; font-weight:600; flex:0 0 auto; }
  .badge.drunk{ background: var(--gold-soft); color:var(--gold); }
  .badge.removed{ background: var(--danger-soft); color: var(--danger); }

  /* fab */
  .fab{
    position:fixed; right:20px; bottom:26px; z-index:30;
    width:56px; height:56px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--wine-bright), #5c1620 75%);
    color:#F5E2E5; font-size:26px; font-weight:400;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(124,31,46,.28), 0 0 0 1px rgba(0,0,0,.04);
  }
  .fab:active{ transform: scale(.94); }

  /* overlay + sheet */
  .overlay{ position:fixed; inset:0; background: rgba(8,6,6,.6); backdrop-filter: blur(2px); z-index:40; opacity:0; pointer-events:none; transition: opacity .2s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background: linear-gradient(180deg, var(--wood-2), var(--bg-2));
    border-radius: 22px 22px 0 0;
    border-top:1px solid rgba(40,28,16,.08);
    box-shadow: 0 -10px 40px rgba(0,0,0,.5);
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    max-height: 88vh; overflow-y:auto;
    padding: 10px 20px 26px;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet .grabber{ width:38px; height:4px; border-radius:3px; background: rgba(40,28,16,.16); margin: 6px auto 14px; }
  .sheet.wide{ max-height:92vh; }

  .bottle-card{ display:flex; gap:14px; align-items:flex-start; }
  .bottle-card .thumb{ width:64px; height:64px; font-size:24px; }
  .bottle-card .meta-name{ font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.25; }
  .bottle-card .meta-sub{ font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--gold); margin-top:1px; }
  .bottle-card .meta-line{ font-size:12.5px; color:var(--text-dim); margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .stars{ display:flex; gap:3px; margin-top:8px; }
  .stars button{ font-size:17px; color: rgba(40,28,16,.16); line-height:1; }
  .stars button.on{ color: var(--gold); }

  .kv-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .kv-row .k{ color:var(--text-dim); }
  .kv-row .v{ font-family:var(--font-mono); text-align:right; }
  .more-toggle{ font-size:12.5px; color:var(--text-dim); padding:12px 0 4px; display:flex; align-items:center; gap:5px; }
  .more-panel{ display:none; }
  .more-panel.open{ display:block; }

  .btn{ padding:13px 14px; border-radius:var(--radius-md); font-size:14px; font-weight:600; text-align:center; letter-spacing:.01em; }
  .btn-primary{ background: linear-gradient(180deg, var(--wine-bright), var(--wine)); color:#F6E4E6; }
  .btn-outline{ border:1.5px solid rgba(40,28,16,.18); color:var(--text); }
  .btn-outline.danger{ border-color: rgba(184,71,63,.5); color: var(--danger); }
  .btn-gold{ background: var(--gold); color:#241b08; }
  .btn-row{ display:flex; gap:10px; margin-top:16px; }
  .btn-row > *{ flex:1; }
  .btn-full{ width:100%; margin-top:10px; }

  /* modal (add/edit) */
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .modal-head h2{ font-family:var(--font-display); font-size:22px; font-weight:700; margin:0; }
  .close-x{ font-size:20px; color:var(--text-dim); width:32px; height:32px; display:flex; align-items:center; justify-content:center; }

  .photo-zone{
    border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:18px; text-align:center; margin-bottom:16px; position:relative;
  }
  .photo-zone img{ max-width:100%; max-height:180px; border-radius:10px; margin-bottom:10px; }
  .photo-zone .hint{ font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  .photo-actions{ display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .photo-actions .btn{ padding:9px 14px; font-size:13px; }
  input[type=file]{ display:none; }
  .ai-status{ font-size:12.5px; color:var(--gold); margin-top:10px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .spinner{ width:13px; height:13px; border-radius:50%; border:2px solid rgba(201,162,75,.25); border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .slot-picker{ border:1px solid var(--line); border-radius:var(--radius-md); padding:12px; }
  .slot-picker .rack{ padding:12px 10px; }
  .slot-picker-empty{ font-size:13px; color:var(--text-dim); text-align:center; padding:14px 0; }
  .picked-note{ font-size:12.5px; color:var(--gold); margin-top:8px; }

  .toast-wrap{ position:fixed; left:0; right:0; bottom:96px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast{
    background: var(--wood-2); border:1px solid var(--line); color:var(--text); font-size:13.5px;
    padding:10px 18px; border-radius:30px; box-shadow: 0 6px 20px rgba(40,28,16,.18);
    opacity:0; transform: translateY(8px); transition: all .25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .form-scroll{ max-height:70vh; overflow-y:auto; padding-right:2px; margin-top:6px; }
  .divider-label{ font-size:11.5px; letter-spacing:.08em; color:var(--text-faint); text-transform:uppercase; margin: 18px 0 10px; }

  a.credit{ color:var(--text-faint); }
</style>
</head>
<body>

<header class="top">
  <div class="title-row">
    <h1>酒<em>窖</em> Cellar</h1>
    <div style="display:flex; align-items:center; gap:6px;">
      <div class="stats" id="statsLine">— 支 · — 空位</div>
      <button class="search-btn" id="searchToggle" title="搜尋" aria-label="搜尋">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="search-btn" id="settingsToggle" title="同步設定" aria-label="同步設定" style="position:relative;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V19.5a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H4.5a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H10a1.7 1.7 0 001-1.55V4.5a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V10a1.7 1.7 0 001.55 1h.09a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="syncDot" style="position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--text-faint);"></span>
      </button>
    </div>
  </div>
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="搜尋酒莊、產區、年份…" />
  </div>
  <nav class="tabs">
    <button data-tab="virtual" class="active">虛擬酒窖</button>
    <button data-tab="list">清單檢視</button>
    <button data-tab="history">歷程記錄</button>
  </nav>
</header>
<div class="cellar-bar" id="cellarBar">
  <div class="cellar-chips" id="cellarChips"></div>
  <button class="icon-btn" id="cellarAddBtn" title="新增酒櫃" aria-label="新增酒櫃">＋</button>
  <button class="icon-btn" id="cellarRenameBtn" title="重新命名目前酒櫃" aria-label="重新命名目前酒櫃">✏️</button>
  <button class="icon-btn" id="cellarDeleteBtn" title="刪除目前酒櫃" aria-label="刪除目前酒櫃">🗑</button>
</div>
<div class="legend" id="legendRow">
  <span><i class="dot red"></i>紅酒</span>
  <span><i class="dot white"></i>白酒</span>
  <span><i class="dot rose"></i>粉紅酒</span>
  <span><i class="dot sparkling"></i>氣泡酒</span>
  <span><i class="dot sake"></i>清酒</span>
</div>

<main id="mainArea"></main>

<button class="fab" id="fabAdd" aria-label="新增酒瓶">＋</button>

<div class="overlay" id="overlay"></div>

<!-- bottle quick-view sheet -->
<div class="sheet" id="bottleSheet">
  <div class="grabber"></div>
  <div id="bottleSheetContent"></div>
</div>

<!-- add/edit bottle sheet -->
<div class="sheet wide" id="formSheet">
  <div class="grabber"></div>
  <div id="formSheetContent"></div>
</div>

<!-- add shelf sheet -->
<div class="sheet" id="shelfSheet">
  <div class="grabber"></div>
  <div id="shelfSheetContent"></div>
</div>

<!-- move picker sheet -->
<div class="sheet" id="moveSheet">
  <div class="grabber"></div>
  <div id="moveSheetContent"></div>
</div>

<!-- settings / sync sheet -->
<div class="sheet" id="settingsSheet">
  <div class="grabber"></div>
  <div id="settingsSheetContent"></div>
</div>

<!-- duplicate-from-existing picker sheet -->
<div class="sheet wide" id="dupSheet">
  <div class="grabber"></div>
  <div id="dupSheetContent"></div>
</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script>
/* ---------------- constants ---------------- */
const TYPE_LABEL = {red:'紅酒', white:'白酒', rose:'粉紅酒', sparkling:'氣泡酒', sake:'清酒'};
const TYPE_ICON = {red:'🍷', white:'🥂', rose:'🌸', sparkling:'🍾', sake:'🍶'};
const LOCAL_URL_KEY = 'cellarApiUrl';
const LOCAL_CACHE_KEY = 'cellarLocalCache';

/* ---------------- state ---------------- */
let state = { cellars: [], shelves: [], bottles: {} };
let history = [];
let currentTab = 'virtual';
let currentCellarId = localStorage.getItem('cellarCurrentId') || null;
let searchQuery = '';
let photoCache = {}; // bottleId -> dataURL
let pendingPhoto = null; // dataURL staged in add/edit form
let editingId = null; // bottle id being edited, or null when creating
let targetSlot = null; // {shelfId, r, c} chosen for new bottle
let openBottleCtx = null; // {id, shelfId, r, c} currently open in quick view
let API_URL = localStorage.getItem(LOCAL_URL_KEY) || '';
let syncOk = false;

/* ---------------- Google Sheets sync layer ---------------- */
function setSyncDot(status){
  // status: 'ok' | 'bad' | 'off'
  const dot = document.getElementById('syncDot');
  if(!dot) return;
  dot.style.background = status === 'ok' ? '#5FAE6E' : (status === 'bad' ? 'var(--danger)' : 'var(--text-faint)');
  syncOk = status === 'ok';
}
async function apiGet(type, params){
  const qs = new URLSearchParams({ type, ...(params||{}) }).toString();
  const res = await fetch(API_URL + '?' + qs);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'unknown error');
  return json.data;
}
async function apiPost(body){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'unknown error');
  return json;
}
function cacheLocally(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ state, history })); }catch(e){}
}
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(raw){ const parsed = JSON.parse(raw); state = parsed.state || state; history = parsed.history || history; return true; }
  }catch(e){}
  return false;
}

/* ---------------- storage helpers ---------------- */
async function loadAll(){
  if(!API_URL){
    loadLocalCache();
    migrateState();
    setSyncDot('off');
    render();
    openSettingsSheet(true);
    return;
  }
  try{
    const [remoteState, remoteHistory] = await Promise.all([ apiGet('state'), apiGet('history') ]);
    state = remoteState && remoteState.shelves ? remoteState : state;
    history = remoteHistory || [];
    setSyncDot('ok');
    const migrated = migrateState();
    cacheLocally();
    if(migrated) await saveCellar();
  }catch(e){
    setSyncDot('bad');
    const hadCache = loadLocalCache();
    migrateState();
    toast(hadCache ? '無法連線，先顯示上次同步的資料' : '無法連線到試算表，請檢查同步設定');
  }
  render();
}
/** Ensures at least one cellar exists and every shelf belongs to one. Returns true if it changed anything. */
function migrateState(){
  let changed = false;
  if(!state.cellars) state.cellars = [];
  if(!state.shelves) state.shelves = [];
  if(!state.bottles) state.bottles = {};
  const wasFreshEmpty = state.cellars.length === 0 && state.shelves.length === 0 && Object.keys(state.bottles).length === 0;
  if(!state.cellars.length){
    state.cellars.push(makeCellar('酒櫃 1'));
    changed = true;
  }
  const validIds = new Set(state.cellars.map(c => c.id));
  state.shelves.forEach(sh => {
    if(!sh.cellarId || !validIds.has(sh.cellarId)){
      sh.cellarId = state.cellars[0].id;
      changed = true;
    }
  });
  if(!currentCellarId || !validIds.has(currentCellarId)){
    currentCellarId = state.cellars[0].id;
  }
  if(wasFreshEmpty){
    state.shelves.push(makeShelf('酒架 1', 3, 6, state.cellars[0].id));
    changed = true;
  }
  return changed;
}
async function saveCellar(){
  cacheLocally();
  if(!API_URL){ setSyncDot('off'); return; }
  try{ await apiPost({ type:'state', data: state }); setSyncDot('ok'); }
  catch(e){ setSyncDot('bad'); toast('同步失敗，已先保留在此裝置'); }
}
async function saveHistory(){
  cacheLocally();
  if(!API_URL) return;
  try{ await apiPost({ type:'history', data: history }); }
  catch(e){ /* non-critical, state already reflects change locally */ }
}
function makeCellar(name){
  return { id: 'c_' + Math.random().toString(36).slice(2,9), name };
}
function makeShelf(name, rows, cols, cellarId){
  return {
    id: 's_' + Math.random().toString(36).slice(2,9),
    cellarId, name, rows, cols,
    slots: Array.from({length:rows}, () => Array.from({length:cols}, () => null))
  };
}
function currentCellar(){ return state.cellars.find(c => c.id === currentCellarId) || state.cellars[0]; }
function shelvesInCurrentCellar(){ return state.shelves.filter(s => s.cellarId === currentCellarId); }
async function getPhoto(id){
  if(photoCache[id] !== undefined) return photoCache[id];
  if(!API_URL){ photoCache[id] = null; return null; }
  try{
    const data = await apiGet('photo', { id });
    photoCache[id] = data || null;
  }catch(e){ photoCache[id] = null; }
  return photoCache[id];
}
async function setPhoto(id, dataUrl){
  photoCache[id] = dataUrl;
  if(!API_URL) return;
  try{ await apiPost({ type:'photo', id, dataUrl }); }
  catch(e){ toast('照片同步失敗（其他資料已儲存）'); }
}
async function deletePhoto(id){
  delete photoCache[id];
  if(!API_URL) return;
  try{ await apiPost({ type:'deletePhoto', id }); }catch(e){}
}

/* ---------------- utils ---------------- */
function uid(){ return 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtPrice(b){
  if(b.price === '' || b.price === undefined || b.price === null) return '—';
  const n = Number(b.price);
  return (b.currency || 'NT$') + ' ' + (isNaN(n) ? b.price : n.toLocaleString());
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 2200);
}
function computeStats(){
  let filled = 0, bottles = 0, empty = 0;
  for(const sh of shelvesInCurrentCellar()){
    for(const row of sh.slots){
      for(const cell of row){
        if(cell){ filled++; bottles += (state.bottles[cell.id]?.quantity || 1); }
        else empty++;
      }
    }
  }
  return { filled, bottles, empty };
}
function allBottlesFlat(scopeToCellar){
  const out = [];
  const shelves = scopeToCellar ? shelvesInCurrentCellar() : state.shelves;
  for(const sh of shelves){
    sh.slots.forEach((row, r) => row.forEach((cell, c) => {
      if(cell){
        const b = state.bottles[cell.id];
        if(b) out.push({ ...b, id: cell.id, shelfId: sh.id, shelfName: sh.name, cellarId: sh.cellarId, r, c });
      }
    }));
  }
  return out;
}

/* ---------------- render dispatch ---------------- */
function render(){
  document.getElementById('statsLine').textContent = (() => {
    const s = computeStats();
    return `${s.bottles} 支 · ${s.empty} 空位`;
  })();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  document.getElementById('legendRow').style.display = currentTab === 'virtual' ? 'flex' : 'none';
  document.getElementById('cellarBar').style.display = currentTab === 'history' ? 'none' : 'flex';
  renderCellarBar();
  const main = document.getElementById('mainArea');
  main.innerHTML = '';
  if(currentTab === 'virtual') renderVirtual(main);
  else if(currentTab === 'list') renderList(main);
  else renderHistory(main);
}

async function handleAddCellar(){
  const name = prompt('酒櫃名稱', '酒櫃 ' + (state.cellars.length + 1));
  if(!name || !name.trim()) return;
  const c = makeCellar(name.trim());
  state.cellars.push(c);
  currentCellarId = c.id;
  localStorage.setItem('cellarCurrentId', c.id);
  await saveCellar();
  render();
  toast('已新增酒櫃');
}
async function handleRenameCellar(){
  const c = currentCellar();
  if(!c) return;
  const name = prompt('酒櫃名稱', c.name);
  if(!name || !name.trim()) return;
  c.name = name.trim();
  await saveCellar();
  render();
}
async function handleDeleteCellar(){
  const c = currentCellar();
  if(!c) return;
  if(state.cellars.length <= 1){ toast('至少需保留一個酒櫃'); return; }
  const hasShelf = state.shelves.some(s => s.cellarId === c.id);
  if(hasShelf){ toast('請先刪除這個酒櫃裡的所有酒架，才能刪除酒櫃'); return; }
  if(!confirm('確定要刪除「' + c.name + '」嗎？此動作無法復原。')) return;
  state.cellars = state.cellars.filter(x => x.id !== c.id);
  currentCellarId = state.cellars[0].id;
  localStorage.setItem('cellarCurrentId', currentCellarId);
  await saveCellar();
  render();
  toast('已刪除酒櫃');
}

function getShelfName(shelfId){ return state.shelves.find(s=>s.id===shelfId)?.name || ''; }

async function handleDrink(id, shelfId, r, c){
  const b = state.bottles[id];
  const shelf = state.shelves.find(s=>s.id===shelfId);
  const cellarName = state.cellars.find(x=>x.id===shelf?.cellarId)?.name || '';
  history.push({ producer:b.producer, name:b.name, vintage:b.vintage, region:b.region, date: todayStr(), reason:'drunk', cellarName });
  if((b.quantity||1) > 1){
    b.quantity -= 1;
    toast('已喝掉 1 瓶，庫存更新');
  }else{
    shelf.slots[r][c] = null;
    delete state.bottles[id];
    await deletePhoto(id);
    toast('已喝掉並移除');
    closeAllSheets();
  }
  openBottleCtx = null;
  await saveCellar(); await saveHistory(); render();
  if((state.bottles[id])) openBottleSheet(id, shelfId, r, c);
}
async function handleRemove(id, shelfId, r, c, reason){
  const b = state.bottles[id];
  const shelf = state.shelves.find(s=>s.id===shelfId);
  const cellarName = state.cellars.find(x=>x.id===shelf?.cellarId)?.name || '';
  history.push({ producer:b.producer, name:b.name, vintage:b.vintage, region:b.region, date: todayStr(), reason, cellarName });
  shelf.slots[r][c] = null;
  delete state.bottles[id];
  await deletePhoto(id);
  openBottleCtx = null;
  await saveCellar(); await saveHistory(); render();
  closeAllSheets();
  toast('已移除');
}

function openDuplicatePicker(){
  const content = document.getElementById('dupSheetContent');
  content.innerHTML = `
    <div class="modal-head"><h2>從已加入的酒款帶入</h2><button class="close-x" id="dupClose">✕</button></div>
    <p style="font-size:12.5px; color:var(--text-dim); margin-top:0;">選一支，資料（含酒標照）會直接帶入下面的新增表單，你只要確認酒架位置就好。</p>
    <div class="field"><input type="text" id="dupSearch" placeholder="搜尋酒莊、產區、年份…" /></div>
    <div id="dupList"></div>
  `;
  document.getElementById('dupClose').onclick = () => {
    document.getElementById('dupSheet').classList.remove('open');
    if(!document.getElementById('formSheet').classList.contains('open')) document.getElementById('overlay').classList.remove('open');
  };
  const listEl = document.getElementById('dupList');
  function draw(q){
    let items = allBottlesFlat(false);
    if(q && q.trim()){
      const qq = q.trim().toLowerCase();
      items = items.filter(b => [b.producer,b.name,b.vintage,b.region,b.country].join(' ').toLowerCase().includes(qq));
    }
    items.sort((a,b) => (a.producer||'').localeCompare(b.producer||''));
    if(!items.length){
      listEl.innerHTML = `<div class="slot-picker-empty">找不到符合的酒</div>`;
      return;
    }
    listEl.innerHTML = '';
    items.forEach(b => {
      const row = document.createElement('div');
      row.className = 'list-row';
      const cellarName = state.cellars.find(c => c.id === b.cellarId)?.name || '';
      row.innerHTML = `
        <div class="thumb" data-thumb="${b.id}">${TYPE_ICON[b.type]||'🍷'}</div>
        <div class="info">
          <div class="name">${esc(b.producer || '未命名酒款')}</div>
          <div class="sub">${esc(b.vintage||'')} ${esc(b.name||'')}${b.region ? ' · '+esc(b.region) : ''}</div>
        </div>
        <div class="loc">${esc(cellarName)}<br/>${esc(b.shelfName)}</div>`;
      row.onclick = () => applyDuplicate(b);
      listEl.appendChild(row);
      getPhoto(b.id).then(url => {
        if(url){
          const t = row.querySelector('[data-thumb]');
          if(t) t.innerHTML = `<img src="${url}" alt="">`;
        }
      });
    });
  }
  draw('');
  document.getElementById('dupSearch').addEventListener('input', e => draw(e.target.value));
  openSheet('dupSheet');
}

  document.getElementById('f_region').value = b.region || '';
  document.getElementById('f_country').value = b.country || '';
  document.getElementById('f_price').value = b.price ?? '';
  document.getElementById('f_currency').value = b.currency || 'NT$';
  document.getElementById('f_merchant').value = b.merchant || '';
  document.getElementById('f_condition').value = b.condition || '';

function syncPhotoZone(){
  const zone = document.getElementById('photoZone');
  if(!zone) return;
  const hint = document.getElementById('photoHint');
  const clearBtn = document.getElementById('photoClearBtn');
  const old = zone.querySelector('img');
  if(old) old.remove();
  if(pendingPhoto){
    const img = document.createElement('img');
    img.src = pendingPhoto;
    zone.insertBefore(img, zone.firstChild);
    hint.textContent = '已加入酒標照片';
    clearBtn.style.display = '';
  }else{
    hint.textContent = '拍下酒標，讓 AI 幫你辨識酒莊、年份與產區';
    clearBtn.style.display = 'none';
  }
}

function renderSlotPicker(){
  const wrap = document.getElementById('slotPickerWrap');
  if(editingId){
    wrap.innerHTML = `<div class="picked-note">位置：${esc(getShelfName(targetSlot.shelfId))} · 第${targetSlot.r+1}排 第${targetSlot.c+1}位（如需更換位置，請用「搬移」功能）</div>`;
    return;
  }
  if(targetSlot){
    wrap.innerHTML = `<div class="picked-note">已選擇位置：${esc(getShelfName(targetSlot.shelfId))} · 第${targetSlot.r+1}排 第${targetSlot.c+1}位</div>
      <button class="btn btn-outline btn-full" id="slotChangeBtn" type="button" style="margin-top:8px;">更換位置</button>`;
    document.getElementById('slotChangeBtn').onclick = () => { targetSlot = null; renderSlotPicker(); };
    return;
  }
  // picker: choose first available empty slot per shelf, tap to pick (current cellar only)
  const shelvesHere = shelvesInCurrentCellar();
  if(!shelvesHere.length){
    wrap.innerHTML = `<div class="slot-picker-empty">這個酒櫃還沒有酒架，請先新增一個酒架。</div>`;
    return;
  }
  const picker = document.createElement('div');
  picker.className = 'slot-picker';
  shelvesHere.forEach(sh => {
    const hasEmpty = sh.slots.some(row => row.some(c => !c));
    const block = document.createElement('div');
    block.style.marginBottom = '14px';
    block.innerHTML = `<div style="font-size:13px; font-weight:600; margin-bottom:8px;">${esc(sh.name)}</div><div class="rack"></div>`;
    const rack = block.querySelector('.rack');
    sh.slots.forEach((row, r) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'rack-row' + (r % 2 === 1 ? ' offset' : '');
      row.forEach((cell, c) => {
        const s = document.createElement('button');
        if(cell){
          const bb = state.bottles[cell.id];
          s.className = 'slot filled type-' + (bb?.type||'red');
          s.textContent = bb?.vintage || '';
          s.disabled = true; s.style.opacity = .35;
        }else{
          s.className = 'slot empty';
          s.onclick = () => { targetSlot = { shelfId: sh.id, r, c }; renderSlotPicker(); };
        }
        rowEl.appendChild(s);
      });
      rack.appendChild(rowEl);
    });
    if(hasEmpty) picker.appendChild(block);
  });
  wrap.innerHTML = '';
  wrap.appendChild(picker);
}

function downscaleImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const dataUrl = await downscaleImage(file, 900, 0.72);
  pendingPhoto = dataUrl;
  syncPhotoZone();
  await runLabelRecognition(dataUrl);
  e.target.value = '';
}

async function runLabelRecognition(dataUrl){
  const zone = document.getElementById('photoZone');
  const status = document.createElement('div');
  status.className = 'ai-status';
  status.id = 'aiStatus';
  status.innerHTML = `<span class="spinner"></span> AI 辨識酒標中…`;
  zone.appendChild(status);
  try{
    const base64 = dataUrl.split(',')[1];
    const mediaType = dataUrl.match(/data:(.*?);base64/)[1];
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            { type: 'text', text: '你是專業侍酒師。請辨識這張酒標照片，只回傳一個 JSON 物件，不要任何前後文字、不要 markdown 符號，格式為：{"producer":"酒莊/廠牌名稱","name":"酒款/產區全名，例如 Pauillac (Grand Cru Classé)","vintage":"四位數年份字串，看不出來則空字串","type":"red、white、rose、sparkling、sake 其中之一（清酒請填 sake）","region":"產區","country":"國家（用中文）"}。若無法辨識某欄位請填空字串，不要編造內容。只回傳純 JSON，不要其他文字。' }
          ]
        }]
      })
    });
    const data = await resp.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('no text');
    let jsonStr = textBlock.text.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
    const info = JSON.parse(jsonStr);
    if(info.producer) document.getElementById('f_producer').value = info.producer;
    if(info.name) document.getElementById('f_name').value = info.name;
    if(info.vintage) document.getElementById('f_vintage').value = info.vintage;
    if(info.type && TYPE_LABEL[info.type]) document.getElementById('f_type').value = info.type;
    if(info.region) document.getElementById('f_region').value = info.region;
    if(info.country) document.getElementById('f_country').value = info.country;
    toast('已自動帶入辨識結果，請確認是否正確');
  }catch(err){
    toast('AI 辨識失敗，請手動輸入資訊');
  }finally{
    const s = document.getElementById('aiStatus');
    if(s) s.remove();
  }
}

async function saveBottleForm(){
  const producer = document.getElementById('f_producer').value.trim() || '未命名酒款';
  if(!targetSlot){ toast('請選擇酒架位置'); return; }

  const payload = {
    producer,
    name: document.getElementById('f_name').value.trim(),
    vintage: document.getElementById('f_vintage').value.trim(),
    type: document.getElementById('f_type').value,
    region: document.getElementById('f_region').value.trim(),
    country: document.getElementById('f_country').value.trim(),
    price: document.getElementById('f_price').value,
    currency: document.getElementById('f_currency').value.trim() || 'NT$',
    purchaseDate: document.getElementById('f_date').value || todayStr(),
    quantity: Math.max(1, parseInt(document.getElementById('f_qty').value || '1', 10)),
    merchant: document.getElementById('f_merchant').value.trim(),
    condition: document.getElementById('f_condition').value,
    notes: document.getElementById('f_notes').value.trim(),
    rating: editingId ? (state.bottles[editingId]?.rating || 0) : 0
  };

  let id = editingId;
  if(editingId){
    state.bottles[editingId] = { ...state.bottles[editingId], ...payload };
  }else{
    id = uid();
    state.bottles[id] = payload;
    const shelf = state.shelves.find(s => s.id === targetSlot.shelfId);
    shelf.slots[targetSlot.r][targetSlot.c] = { id };
  }
  if(pendingPhoto){ await setPhoto(id, pendingPhoto); }

  await saveCellar();
  closeAllSheets();
  toast(editingId ? '已儲存變更' : '已加入酒窖');
  editingId = null; targetSlot = null; pendingPhoto = null;
  render();
}

function openSettingsSheet(firstRun){
  const content = document.getElementById('settingsSheetContent');

    </p>
    ${API_URL ? '<button class="btn btn-outline danger btn-full" id="st_disconnect" style="margin-top:14px;">中斷連線（只留在此裝置）</button>' : ''}
  `;
  document.getElementById('settingsClose').onclick = closeAllSheets;
